# SQL LAB · levanta PostgreSQL 16 y SQL Server 2022 en local.
#   docker compose up -d postgres      # solo PostgreSQL
#   docker compose up -d sqlserver     # solo SQL Server (necesita ~2 GB RAM libres)
#   docker compose up -d               # ambos
# Conexiones:
#   PostgreSQL : host=localhost port=5432 db=sql_lab user=lab pass=lab
#   SQL Server : localhost,1433  user=sa  pass=Lab_Pass_2025!   (crear la BD la hace 00_setup.sql)
services:
  postgres:
    image: postgres:16
    container_name: sql_lab_pg
    environment:
      POSTGRES_USER: lab
      POSTGRES_PASSWORD: lab
      POSTGRES_DB: sql_lab
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres:/lab:ro          # los scripts quedan en /lab dentro del contenedor

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: sql_lab_mssql
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "Lab_Pass_2025!"
      MSSQL_PID: Developer          # edición Developer: incluye particionado y todo lo Enterprise
    ports: ["1433:1433"]
    volumes:
      - mssqldata:/var/opt/mssql
      - ./sqlserver:/lab:ro

volumes:
  pgdata:
  mssqldata:
